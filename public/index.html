<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuellApp · Mascotas perdidas en Mendoza</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { margin-bottom: 4px; } .sub { color: #666; margin-top: 0; }
  .form { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin: 16px 0; }
  label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
  input, select, button { font-size: 15px; padding: 8px; }
  button.principal { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #preview { max-height: 140px; border-radius: 8px; }
  #aviso { background: #eef3ff; padding: 10px; border-radius: 6px; margin: 12px 0; white-space: pre-line; }
  #galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 13px; }
  .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; }
  .card.descartada { opacity: .35; }
  .card button { margin-top: 6px; width: 100%; cursor: pointer; }
  .decision { color: #b25e00; margin-top: 24px; }
  #resultado { font-weight: 600; margin-top: 8px; }
</style>
</head>
<body>
<h1>🐾 HuellApp</h1>
<p class="sub">El sistema sugiere, <b>la persona decide</b>.</p>

<div class="form">
  <label>Foto del animal encontrado <input type="file" id="foto" accept="image/*"></label>
  <label>Zona del hallazgo <select id="zona"></select></label>
  <label>Fecha (AAAA-MM-DD) <input type="text" id="fecha"></label>
  <label><span><input type="checkbox" id="falla"> Simular falla del modelo (F2.1)</span></label>
  <button class="principal" id="buscar">Buscar coincidencias</button>
</div>
<img id="preview" hidden>
<div id="aviso" hidden></div>
<div id="galeria"></div>
<h3 class="decision" id="titDecision" hidden>★ Decisión del dueño (no delegable)</h3>
<div id="resultado"></div>

<script>
const $ = (id) => document.getElementById(id);

fetch('/api/config').then((r) => r.json()).then((c) => {
  $('zona').innerHTML = c.zonas.map((z) => `<option>${z}</option>`).join('');
  $('fecha').value = c.hoy;
});

$('foto').onchange = () => {
  const f = $('foto').files[0];
  if (f) { $('preview').src = URL.createObjectURL(f); $('preview').hidden = false; }
};

$('buscar').onclick = async () => {
  const f = $('foto').files[0];
  if (!f) { $('aviso').hidden = false; $('aviso').textContent = 'Falta la foto.'; return; }
  const fd = new FormData();
  fd.append('foto', f);
  fd.append('zona', $('zona').value);
  fd.append('fecha', $('fecha').value);
  fd.append('simularFalla', $('falla').checked);
  $('aviso').hidden = false;
  $('aviso').textContent = 'Buscando...';
  $('resultado').textContent = '';
  const r = await (await fetch('/api/buscar', { method: 'POST', body: fd })).json();
  if (r.error) { $('aviso').textContent = r.error; $('galeria').innerHTML = ''; return; }
  $('aviso').textContent = (r.modo === 'reducido' ? '⚠️ Modo reducido: solo zona y fecha.\n' : '') + r.aviso;
  $('titDecision').hidden = !r.candidatas.length;
  $('galeria').innerHTML = '';
  for (const c of r.candidatas) {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<img src="${c.foto}"><div><b>${c.id}</b> · ${c.zona}<br>${c.fecha} · ` +
      `${c.puntaje === null ? 's/puntaje' : c.puntaje.toFixed(2)}</div>` +
      `<button data-d="Es mi mascota">Es mi mascota</button><button data-d="No es">No es</button>`;
    d.querySelectorAll('button').forEach((b) => b.onclick = () => decidir(c.id, b.dataset.d, d));
    $('galeria').appendChild(d);
  }
};

async function decidir(id, decision, card) {
  const r = await (await fetch('/api/decidir', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, decision }),
  })).json();
  $('resultado').textContent = `${id}: ${r.mensaje}`;
  if (decision === 'No es') card.classList.add('descartada');
}
</script>
</body>
</html>
